services:
  - type: web
    runtime: node
    name: werewolf
    branch: main
    region: frankfurt
    plan: free
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: werewolf-rooms
          property: connectionString
databases:
  - name: werewolf-rooms
    region: frankfurt
    plan: free
    ipAllowList: []
